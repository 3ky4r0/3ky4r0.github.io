<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --surface: hsl(0 0% 100%);
    --on-surface: hsl(0 0% 12%);
    --outline: hsl(220 15% 88%);
    --secondary: hsl(220 10% 55%);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --surface: hsl(222 5% 7%);
      --on-surface: hsl(222 5% 86%);
      --outline: hsl(222 5% 20%);
      --secondary: hsl(222 5% 55%);
    }
  }

  html,
  body {
    width: 100%;
    height: 100%;
    background: var(--surface);
    display: flex;
    justify-content: center;
    padding-top: 18vh;
    overflow: hidden;
  }

  #cmd {
    width: min(480px, 92vw);
    height: 48px;

    background: var(--surface);
    color: var(--on-surface);

    border: 1px solid var(--outline);
    border-radius: 8px;

    outline: none;

    padding: 0 16px;

    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;

    caret-color: var(--secondary);
  }

  #cmd::placeholder {
    color: var(--secondary);
    opacity: 0.6;
  }
</style>
</head>

<body>

<input
  id="cmd"
  type="text"
  autocomplete="off"
  spellcheck="false"
  placeholder="Type / to search"
/>

<script>
  const BASE = 'https://duyxyz.github.io/';
  const input = document.getElementById('cmd');

  document.addEventListener('keydown', e => {

    if (e.key === '/' && document.activeElement !== input) {
      e.preventDefault();
      input.focus();
      return;
    }

    if (e.key === 'Escape') {
      input.blur();
      input.value = '';
      return;
    }

    if (e.key === 'Enter' && document.activeElement === input) {

      const cmd = input.value.trim();

      if (!cmd) return;

      window.open(BASE + cmd, '_blank');

      input.value = '';
      input.blur();
    }

  });
</script>

</body>
</html>
