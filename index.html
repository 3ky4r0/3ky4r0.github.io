<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duyxyz</title>
  <meta name="description" content="duyxyz.">
  <meta name="google-site-verification" content="pZVinKBAW4pfP9EmQFUHf_y3g5mnE8Yv05ubMc5diQw" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 24px;
      background-color: #f9fafb;
      color: #111827;
    }

    #links a {
      display: block;
      padding: 14px 20px;
      margin: 12px 0;
      color: #1f2937;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1.05em;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    #links a:hover {
      border-color: #d1d5db;
      background-color: #f9fafb;
      color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    #status {
      color: #6b7280;
      font-size: 0.95em;
      text-align: center;
      margin-top: 20px;
    }

    #fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: transparent;
      color: #666;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.2s, color 0.2s, transform 0.15s;
    }

    #fab:hover {
      background-color: rgba(0, 0, 0, 0.08);
      color: #000;
      transform: scale(1.08);
    }

    #fab svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }
  </style>
</head>

<body>

  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">duyxyz</h1>
    <div id="status">Đang tải</div>
    <div id="links"></div>
  </main>

  <script>
    const PROXY = 'https://corsproxy.io/?url=';
    const TARGETS = [
      'https://rentry.org/duyxyz',
      'https://rentry.co/duyxyz'
    ];

    function parseLinks(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      let links = Array.from(doc.querySelectorAll('a.external[href]'));
      if (links.length === 0) links = Array.from(doc.querySelectorAll('.entry-text a[href]'));
      if (links.length === 0) links = Array.from(doc.querySelectorAll('article a[href]'));
      return links;
    }

    function tryFetch(index) {
      if (index >= TARGETS.length) {
        document.getElementById('status').textContent = 'Không tìm thấy link nào.';
        return;
      }

      const url = TARGETS[index];
      fetch(PROXY + encodeURIComponent(url + '?_=' + Date.now()), { cache: 'no-store' })
        .then(r => r.text())
        .then(html => {
          const links = parseLinks(html);
          const container = document.getElementById('links');
          const status = document.getElementById('status');

          if (links.length === 0) {
            // Thử nguồn tiếp theo
            tryFetch(index + 1);
            return;
          }

          status.textContent = '';
          links.forEach(a => {
            const el = document.createElement('a');
            el.href = a.getAttribute('href');
            el.textContent = a.textContent.trim();
            el.target = '_blank';
            el.rel = 'noopener noreferrer';
            container.appendChild(el);
          });
        })
        .catch(() => {
          // Nguồn hiện tại lỗi, thử nguồn tiếp theo
          tryFetch(index + 1);
        });
    }

    tryFetch(0);
  </script>

  <a id="fab" href="https://rentry.co/duyxyz" target="_blank" rel="noopener noreferrer" title="Mở rentry.co/duyxyz">

  </a>

</body>

</html>
