<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duyxyz</title>
  <meta name="description" content="duyxyz.">
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 0 16px;
    }

    a {
      display: block;
      margin: 8px 0;
    }

    #status {
      color: gray;
      font-size: 0.9em;
    }
  </style>
</head>

<body>

  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">duyxyz</h1>
    <div id="status">Đang tải</div>
    <div id="links"></div>
  </main>

  <script>
    const TARGET = 'https://rentry.org/duyxyz';

    // Danh sách proxy, thử lần lượt
    const PROXIES = [
      url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`,
      url => `https://corsproxy.io/?url=${encodeURIComponent(url)}&t=${Date.now()}`,
      url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    ];

    async function fetchHtml(target) {
      for (const makeUrl of PROXIES) {
        try {
          const res = await fetch(makeUrl(target));
          if (!res.ok) continue;
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('json')) {
            const data = await res.json();
            return data.contents;
          }
          return await res.text();
        } catch (e) {
          console.warn('Proxy lỗi, thử tiếp:', makeUrl(target), e.message);
        }
      }
      throw new Error('Tất cả proxy đều thất bại');
    }

    fetchHtml(TARGET)
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // Lấy tất cả link ngoài (không phải rentry)
        const links = Array.from(doc.querySelectorAll('a[href]')).filter(a => {
          const href = a.getAttribute('href') || '';
          const text = a.textContent.trim();
          return text && href.startsWith('http') && !href.includes('rentry.');
        });

        const container = document.getElementById('links');
        const status = document.getElementById('status');

        if (links.length === 0) {
          status.textContent = 'Không tìm thấy link.';
          return;
        }

        status.textContent = '';
        links.forEach(a => {
          const el = document.createElement('a');
          el.href = a.getAttribute('href');
          el.textContent = a.textContent.trim();
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
          container.appendChild(el);
        });
      })
      .catch(err => {
        document.getElementById('status').textContent = 'Lỗi: ' + err.message;
        console.error(err);
      });
  </script>

</body>

</html>
