<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Favicon Extractor</title>
<meta name="description" content="Dán link trang web để lấy favicon."/>
<style>
  body { font-family: sans-serif; max-width: 620px; margin: 40px auto; padding: 0 16px; }
  input { font-size: 14px; padding: 6px 10px; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  button { font-size: 14px; padding: 6px 12px; cursor: pointer; margin: 2px; }
  #errBox { color: red; display: none; margin-bottom: 8px; }
  #loading { display: none; margin-bottom: 8px; }
  #card { display: none; }
  #favGrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .fav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px; border: 1px solid transparent; }
  .fav-item.selected { border: 1px solid #000; }
  .fav-item img { width: 32px; height: 32px; object-fit: contain; }
  .fav-item .sz { font-size: 10px; color: gray; }
  #selectedUrl { font-size: 12px; word-break: break-all; margin: 8px 0; min-height: 20px; }
</style>
</head>
<body>
<main>
  <h1>Favicon Extractor</h1>
  <p>Dán link trang web để lấy favicon.</p>

  <div>
    <input id="urlInput" type="url" placeholder="https://example.com" autocomplete="off"/>
    <button onclick="pasteUrl()">Dán</button>
    <button onclick="extract()">Lấy favicon</button>
  </div>

  <div id="errBox"></div>
  <div id="loading">Đang tải…</div>

  <div id="card">
    <p><strong id="siteName"></strong><br><small id="siteUrlDisplay"></small></p>
    <p>Chọn favicon:</p>
    <div id="favGrid"></div>
    <div id="selectedUrl">—</div>
    <button id="btnCopy" onclick="copyUrl()">Sao chép link</button>
    <button onclick="openFavicon()">Mở tab mới ↗</button>
  </div>
</main>

<script>
const SIZES=[16,32,48,64,96,128,180,192,256];
let selectedUrl='';

function pasteUrl(){
  navigator.clipboard.readText().then(t=>{
    document.getElementById('urlInput').value=t.trim();
  });
}

function normalizeUrl(raw){
  raw=raw.trim();
  if(!raw)return null;
  if(!/^https?:\/\//i.test(raw))raw='https://'+raw;
  try{return new URL(raw)}catch{return null}
}

function gFav(host,size){return`https://www.google.com/s2/favicons?domain=${host}&sz=${size}`}

function selectFav(url,el){
  document.querySelectorAll('.fav-item').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected');
  selectedUrl=url;
  document.getElementById('selectedUrl').textContent=url;
  document.getElementById('btnCopy').textContent='Sao chép link';
}

function copyUrl(){
  if(!selectedUrl)return;
  navigator.clipboard.writeText(selectedUrl).then(()=>{
    const b=document.getElementById('btnCopy');
    b.textContent='Đã sao chép!';
    setTimeout(()=>b.textContent='Sao chép link',2000);
  });
}

function openFavicon(){
  if(selectedUrl)window.open(selectedUrl,'_blank','noopener,noreferrer');
}

function buildGrid(host){
  const grid=document.getElementById('favGrid');
  grid.innerHTML='';
  const variants=[
    ...SIZES.map(s=>({url:gFav(host,s),label:`${s}px`})),
    {url:`https://icons.duckduckgo.com/ip3/${host}.ico`,label:'ico'},
    {url:`https://${host}/favicon.ico`,label:'ico'},
    {url:`https://${host}/apple-touch-icon.png`,label:'180px'},
  ];
  const seen=new Set();
  let firstValid=null;
  variants.forEach(({url,label})=>{
    if(seen.has(url))return;seen.add(url);
    const item=document.createElement('div');item.className='fav-item';
    const img=document.createElement('img');img.src=url;
    const sz=document.createElement('span');sz.className='sz';sz.textContent=label;
    item.appendChild(img);item.appendChild(sz);
    img.onload=()=>{
      item.onclick=()=>selectFav(url,item);
      if(!firstValid){firstValid=item;selectFav(url,item)}
    };
    img.onerror=()=>item.style.display='none';
    grid.appendChild(item);
  });
}

function extract(){
  const raw=document.getElementById('urlInput').value;
  const errBox=document.getElementById('errBox');
  errBox.style.display='none';
  document.getElementById('card').style.display='none';
  document.getElementById('loading').style.display='none';
  const parsed=normalizeUrl(raw);
  if(!parsed){errBox.textContent='Link không hợp lệ.';errBox.style.display='block';return}
  const host=parsed.hostname;
  document.getElementById('siteName').textContent=host;
  document.getElementById('siteUrlDisplay').textContent=parsed.href;
  document.getElementById('selectedUrl').textContent='—';
  document.getElementById('loading').style.display='block';
  selectedUrl='';
  setTimeout(()=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('card').style.display='block';
    buildGrid(host);
  },500);
}

document.getElementById('urlInput').addEventListener('keydown',e=>{if(e.key==='Enter')extract()});
</script>
</body>
</html>
